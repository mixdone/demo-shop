server {
    listen *:80;
    root /var/www/html;
    index /index.php;

    location / {
        try_files $uri /static$uri @php;
    }

    location @php {
        root /var/www/html/core;

        if (!-f $document_root$uri.php) {
            return 301 /index;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name.php;
        fastcgi_pass php-app:9000;

    }

    location ~ \.php$ {
        root /var/www/html/core;

        try_files $uri /index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php-app:9000;
    }

    resolver 127.0.0.11 valid=30s;

    location ~* \.(gif|jpg|png|jpeg|webp)$ {
    set $minio "minio-s3:9000";

    proxy_pass http://$minio/shop-products$request_uri;

    proxy_set_header Host $minio;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Authorization;
}

}

