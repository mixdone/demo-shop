services:
  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "80:80"
    volumes:
      - ./site/core:/var/www/html/core
      - ./site/static:/var/www/html/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - php-app
  
  php-app:
    build:
      context: .
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      SEAWEED_ACCESS_KEY: "${SEAWEED_ACCESS_KEY}"
      SEAWEED_SECRET_KEY: "${SEAWEED_SECRET_KEY}"
    volumes:
      - ./site/core:/var/www/html/core
      - ./php.ini:/etc/php/8.2/fpm/php.ini
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  
  mysql-db:
    image: mysql:8.4.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    command: >
      server -dir=/data
      -s3
      -s3.port=8333
    ports:
      - "8333:8333"  
      - "8888:8888"  
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs:/etc/seaweedfs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.39
    environment:
      APP_ACCESS_KEY: "${SEAWEED_ACCESS_KEY}"
      APP_SECRET_KEY: "${SEAWEED_SECRET_KEY}"
    volumes:
      - ./shop-products:/shop-products
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 's3.configure -user=php-app -access_key='$$APP_ACCESS_KEY' -secret_key='$$APP_SECRET_KEY' -actions=Admin,Read,Write,List,Tagging -apply' | weed shell -master seaweedfs:9333;
      
      echo 's3.bucket.create -name shop-products' | weed shell -master seaweedfs:9333;
      
      echo 's3.bucket.access -name shop-products -user anonymous -access Read,List' | weed shell -master seaweedfs:9333;
      
      weed filer.copy /shop-products/  http://seaweedfs:8888/buckets/;

      exit 0;
      "

  kafka-broker:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker:9092"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 45000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    deploy:
      resources:
        limits:
          memory: 1gb
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - kafka-data:/tmp/lib/kafka/data
    
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka-broker:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --topic new-orders --partitions 3 --replication-factor 1 --if-not-exists;
        
        exit 0;   
      "
  php-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

    

volumes:
  mysql-data:
  kafka-data:
  seaweedfs-data:
