services:
  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "80:80"
    volumes:
      - ./site/core:/var/www/html/core
      - ./site/static:/var/www/html/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - php-app
  
  php-app:
    build:
      context: .
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MINIO_USER: "${MINIO_USER}"
      MINIO_PASSWORD: "${MINIO_PASSWORD}"
    volumes:
      - ./site/core:/var/www/html/core
      - ./php.ini:/etc/php/8.2/fpm/php.ini
    depends_on:
      mysql-db:
        condition: service_healthy
      minio-s3:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-broker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  
  mysql-db:
    image: mysql:8.4.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  minio-s3:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio-s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_USER: "${MINIO_USER}"
      MINIO_PASSWORD: "${MINIO_PASSWORD}"
    volumes:
      - ./shop-assets:/shop-assets
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set minio-s3 http://minio-s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        /usr/bin/mc admin user add minio-s3 $$MINIO_USER $$MINIO_PASSWORD;
        /usr/bin/mc admin policy attach minio-s3 readwrite --user=$$MINIO_USER;

        /usr/bin/mc mb minio-s3/shop-products;
        /usr/bin/mc anonymous set download minio-s3/shop-products;

        /usr/bin/mc mirror /shop-assets minio-s3/shop-products;
        exit 0;
      "
  kafka-broker:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker:9092"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 45000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    deploy:
      resources:
        limits:
          memory: 1gb
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - kafka-data:/tmp/lib/kafka/data
    
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka-broker:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --topic new-orders --partitions 3 --replication-factor 1 --if-not-exists;
        
        exit 0;   
      "
  php-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

    

volumes:
  mysql-data:
  minio-data:
  kafka-data: